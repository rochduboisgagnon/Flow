name: Release

# A tag is the ONLY road to users. Nothing publishes from a branch push, so an
# ordinary commit can never become a release - `git tag v1.1.0 && git push
# --tags` is the deliberate gesture that ships. electron-builder uploads the
# NSIS installer, the portable zip and latest.yml (the manifest electron-updater
# reads) to the matching GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # electron-builder creates the release and uploads the assets
  # 2026-07-31, security pass. Build provenance: GitHub signs a statement saying
  # WHICH workflow, at WHICH commit, produced these exact bytes. Both are needed
  # for it - a short-lived OIDC identity to sign with, and the right to store the
  # attestation - and neither grants anything else.
  #
  # What it buys, precisely, because overclaiming here would be worse than not
  # doing it: an installer swapped onto the release page by hand, outside this
  # workflow, no longer verifies. Anyone can check with
  # `gh attestation verify Flow-Setup-x.y.z.exe --repo rochduboisgagnon/Flow`.
  #
  # What it does NOT buy: someone who can push a tag still gets a genuine,
  # attested build of whatever they pushed. Provenance proves the OVEN, never
  # the recipe. Only branch protection and code signing address that, and the
  # second one cannot be bought with code.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Review A10: the tag decides NOTHING by itself - electron-builder ships
      # whatever package.json says. A tag that disagrees with the source would
      # publish a mislabeled version, and a re-tag of an already-published
      # version would corrupt the update feed. Refuse both, before any work.
      - name: Guard tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($PKG)"; exit 1
          fi
      - name: Guard version not already released
        # 2026-08-02: the token travels by env, like every other step here. It
        # used to be expanded into the script BODY, which GitHub writes to disk
        # on the runner before executing - so the credential sat in a temp file
        # and on a command line rather than only in the process environment.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$GITHUB_REF_NAME")
          if [ "$CODE" = "200" ]; then
            echo "A release for $GITHUB_REF_NAME already exists"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # keyspy's own postinstall downloads WinKeyServer from GitHub releases;
      # anonymous API calls from shared runner IPs get rate-limited, which is
      # exactly how a release without push-to-talk could slip out. Retry the
      # install, then HARD-verify the binary below - and again inside the zip.
      - name: Install dependencies (with keyspy retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci || (sleep 30 && npm ci) || (sleep 60 && npm ci)

      # The same gates as CI, BEFORE anything is published: a build that breaks
      # must fail here, not on a user's machine halfway through an auto-update.
      # (The real-engine tests skip themselves without a speech model on CI.)
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

      # Two binaries the repository does not carry, and without which the
      # installer would look fine and do nothing:
      #  - WinKeyServer.exe (keyspy) = the push-to-talk hook. ensure-keyspy
      #    downgrades its failure to a warning when CI is set; a RELEASE ships,
      #    so CI is cleared and a missing hook binary fails the job loudly.
      #  - resources/bin/whisper-server-*.exe = the speech engine itself
      #    (gitignored, ~120 MB, fetched from the whisper.cpp fork releases).
      #
      # keyspy's own postinstall downloads its archive ANONYMOUSLY from
      # github.com/teomyth/keyspy - and the runners' shared IPs get
      # rate-limited, which is exactly how the v1.0.1 run died at the gate.
      # Re-fetch AUTHENTICATED (gh quota) when the postinstall came up empty,
      # extracting with the System32 tar by absolute path (Git's MSYS tar
      # reads C:\ as a remote host - documented trap in ensure-keyspy.cjs).
      - name: Fetch keyspy runtime (authenticated fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RT=node_modules/keyspy/runtime
          if [ ! -f "$RT/WinKeyServer.exe" ]; then
            KV=$(node -p "require('./node_modules/keyspy/package.json').version")
            mkdir -p "$RT"
            gh release download "v$KV" --repo teomyth/keyspy --pattern "keyspy-win32-x64.tar.gz" --dir "$RT" --clobber
            # 2026-08-02, security scan (HIGH): verified BEFORE extraction. This
            # archive contains WinKeyServer.exe - the process that watches every
            # keystroke on the machine - and it used to be unpacked on the word
            # of a third-party release page. Pinning the version is not enough:
            # GitHub lets an asset be REPLACED in place, so a tag names a file,
            # never its bytes. Only the hash names the bytes.
            node scripts/verify-native-deps.cjs keyspy "$RT/keyspy-win32-x64.tar.gz"
            "/c/Windows/System32/tar.exe" -xzf "$RT/keyspy-win32-x64.tar.gz" -C "$RT"
          fi
          ls "$RT"
      - name: Ensure push-to-talk binary (hard gate)
        env:
          CI: ""
        run: node scripts/ensure-keyspy.cjs
      # The speech engine binaries live in a GitHub release too, so this call
      # needs the same authenticated budget as the keyspy fetch above: the
      # v1.3.0 run died right here on the 60-per-hour anonymous limit that
      # hosted runners share across every project on the same IP.
      - name: Fetch the speech engine binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-whisper.cjs

      # D1, 2026-08-03. Le moteur qui REDIGE les notes, et la piece qui manquait
      # pour de bon : sans cette etape, l'installeur ne porte pas
      # llama-server.exe, `llamaServer.ready()` est faux pour toujours chez
      # l'utilisateur, et le cablage ajoute dans index.ts ne s'execute jamais.
      #
      # C'est litteralement la panne de la 1.22.0 sous une autre forme. Cette
      # release-la a annonce que l'invariant « un ami qui installe Flow a le
      # produit complet » etait ferme, alors que la classe existait sans que rien
      # ne l'instancie. Livrer le cablage sans cette ligne aurait refait la meme
      # promesse, une couche plus bas. Le controle du zip, plus bas, est ce qui
      # empeche de la refaire une troisieme fois.
      - name: Fetch the notes engine binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-llama.cjs

      - run: npm run build
      # Build WITHOUT publishing: the artifact gets inspected first. Publishing
      # a broken installer and then noticing is the wrong order of operations.
      - name: Build installers
        run: npx electron-builder --win --publish never

      # 2026-08-04 : le seul morceau natif que ce depot compile lui-meme. `npm run
      # build` l'appelle deja, mais il AVERTIT au lieu d'echouer quand aucun
      # compilateur n'est present - ce qui est juste sur une machine de
      # developpement et inacceptable pour une release. Ici, il doit reussir.
      - name: Build the mute helper (hard gate)
        run: |
          node scripts/build-mute.cjs
          test -f resources/bin/flow-mute.exe || { echo "MISSING flow-mute.exe (no silence during a dictation)"; exit 1; }

      # The zip is the ground truth of what is about to ship. An installer with
      # no hook binary or no speech engine passes every gate above EXCEPT this.
      - name: Inspect the artifact BEFORE publishing
        run: |
          ZIP=$(ls dist-build/Flow-*-win.zip)
          unzip -l "$ZIP" > ziplist.txt
          grep -q "WinKeyServer.exe" ziplist.txt || { echo "MISSING WinKeyServer.exe (no push-to-talk)"; exit 1; }
          grep -q "whisper-server-win32-x64-vulkan.exe" ziplist.txt || { echo "MISSING vulkan whisper-server"; exit 1; }
          grep -q "whisper-server-win32-x64-cpu.exe" ziplist.txt || { echo "MISSING cpu whisper-server"; exit 1; }
          # D1: le moteur de redaction. Absent, l'application se lance, dicte,
          # enregistre, et ne rend jamais de notes - une panne silencieuse qui
          # ressemble a une fonctionnalite manquante plutot qu'a un installeur
          # incomplet. Elle a deja ete livree une fois, en 1.22.0.
          grep -q "llama-server.exe" ziplist.txt || { echo "MISSING llama-server.exe (no meeting notes)"; exit 1; }
          grep -q "ggml-vulkan.dll" ziplist.txt || { echo "MISSING ggml backend for llama-server"; exit 1; }
          # 2026-08-04 : le silence pendant une dictee. Absent, la dictee
          # fonctionne et le son des autres applications continue - une
          # fonctionnalite qui manque sans que rien ne le dise. C'est la panne de
          # la 1.22.0 sous une troisieme forme, et elle se ferme ici.
          grep -q "flow-mute.exe" ziplist.txt || { echo "MISSING flow-mute.exe (no silence during a dictation)"; exit 1; }
          # Et l'inverse : les vingt-deux outils que fetch-llama.cjs elague. S'ils
          # reapparaissent, c'est que l'elagage a saute, et ggml-rpc-server.exe -
          # un backend de calcul reseau - serait signe et installe avec Flow.
          # Ecrit en `! grep ... ||` et PAS en `grep ... && { exit 1; }` : cette
          # seconde forme rend 1 quand grep ne trouve rien, c'est-a-dire dans le
          # cas SAIN, et sous `set -e` elle ferait echouer la release a chaque
          # fois que tout va bien.
          ! grep -q "ggml-rpc-server.exe" ziplist.txt || { echo "llama pruning did not run: ggml-rpc-server.exe is in the artifact"; exit 1; }
          test -f dist-build/latest.yml || { echo "MISSING latest.yml (updater feed manifest)"; exit 1; }
          echo "artifact carries the hook, both speech backends, the notes engine, and the feed manifest"

      # Attested BEFORE publishing, deliberately: the bytes that get signed are
      # the ones just inspected above, and nothing between here and the upload
      # can substitute them without the attestation failing.
      - name: Attest what was built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist-build/Flow*Setup*.exe
            dist-build/Flow-*-win.zip

      # gh release create publishes a NON-DRAFT release in one step (a draft
      # would be invisible to electron-updater - review A10). Exactly the four
      # asset kinds electron-builder would have uploaded itself.
      #
      # 2026-08-04 : ET IL SAIT REPRENDRE UNE RELEASE QUI EXISTE DEJA.
      #
      # `gh release create` echoue avec « a release with the same tag name
      # already exists ». Cette etape etait donc a UN incident de devenir
      # definitivement rouge : une relance apres un test instable, un `npm ci`
      # qui tombe, ou n'importe quel echec de la moitie precedente du workflow
      # mourait ici pour toujours - et la seule facon de s'en sortir etait de
      # publier a la main, ce qui prive les binaires de l'attestation de
      # provenance que ce workflow existe pour signer.
      #
      # Les releases 2.0.0 et 2.0.1 en ont fait la demonstration : publiees a la
      # main par-dessus ce workflow, elles ont laisse cette etape rouge, et
      # `gh attestation verify` rendait 404 sur leur installeur.
      #
      # `--clobber` remplace les fichiers de meme nom, donc une relance rend la
      # release IDENTIQUE a ce qu'un premier passage aurait produit plutot que
      # d'y empiler des doublons.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(
            dist-build/Flow*Setup*.exe
            dist-build/*.blockmap
            dist-build/Flow-*-win.zip
            dist-build/latest.yml
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "la release existe deja : on remplace ses fichiers au lieu d'echouer"
            gh release upload "$GITHUB_REF_NAME" --clobber "${ASSETS[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Flow $GITHUB_REF_NAME" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

      # Review A10: the release existing is not the same as the UPDATER seeing
      # it. This asserts what a user's machine will actually fetch: the feed
      # manifest, over the same anonymous "latest" URL electron-updater uses.
      - name: Verify the update feed is live
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
              "https://github.com/${{ github.repository }}/releases/latest/download/latest.yml")
            if [ "$CODE" = "200" ]; then echo "latest.yml is live"; exit 0; fi
            echo "attempt $i: latest.yml not reachable yet ($CODE)"; sleep 30
          done
          echo "latest.yml never became reachable: the release is not visible to the updater"
          exit 1

  # ---------------------------------------------------------------------------
  # 2026-08-04 : macOS ENTRE DANS LE CHEMIN DE PUBLICATION, SUR LE MEME TAG.
  #
  # Roch : « j'aimerais faire en sorte que l'app sur macOS se update sans devoir
  # installer l'ancienne version », et le paquet mac est un asset de la release
  # existante, sur le MEME tag que Windows.
  #
  # LA REGLE « JAMAIS DEUX CHEMINS DE PUBLICATION » N'A PAS BOUGE D'UN MOT. Elle
  # ne dit pas « mac ne publie pas » : elle dit qu'il n'existe qu'UN SEUL GESTE
  # QUI EXPEDIE, et ce geste reste `git tag vX && git push --tags`. Un
  # declencheur, un fichier de workflow, une release. Le job `release` la CREE et
  # possede latest.yml, le feed que les installations Windows interrogent ; ce
  # job-ci n'AJOUTE que des assets et n'appelle jamais `gh release create`.
  #
  # Trois autres formes ont ete pesees et ecartees :
  #  - `release: published` NE SE DECLENCHE JAMAIS. GitHub ne declenche aucun
  #    workflow depuis un evenement produit par secrets.GITHUB_TOKEN (prevention
  #    de boucle), et c'est ce token qui publie plus haut. Le workflow ne partirait
  #    pas, en silence.
  #  - `workflow_run` executerait la version du fichier presente sur la branche par
  #    defaut plutot que celle que le tag a figee, et laisserait un
  #    workflow_dispatch par lequel un asset mac peut etre publie HORS TAG. C'est
  #    exactement le second chemin qu'on refuse.
  #  - une matrice ferait courir deux jobs vers `gh release create` en meme temps
  #    (un vrai TOCTOU, que --clobber n'adresse pas : le cas dangereux est deux
  #    create concurrents), et ferait attendre la publication Windows apres macOS.
  #    On n'installe pas la plateforme neuve en amont de celle qui marche.
  #
  # LA FENETRE : entre la publication Windows et la fin de ce job, la release
  # existe sans son manifeste mac. C'est inoffensif PAR CONSTRUCTION, et c'est une
  # clause du contrat cote application : un 404 sur mac-arm64.json signifie « rien
  # de neuf », jamais « erreur » (voir MacZipChannel.check). Le client repasse dans
  # quatre heures. Fail-closed : un Mac ne voit jamais un etat partiel, il ne voit
  # rien du tout.
  #
  # REPRISE APRES ECHEC : « Re-run failed jobs », jamais « Re-run all jobs ». Le
  # second rejouerait le job `release`, qui mourrait a sa garde « version not
  # already released » puisque la release existe desormais, et ce job-ci ne
  # partirait jamais. `--clobber` rend la reprise idempotente.
  # ---------------------------------------------------------------------------
  mac:
    needs: release
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Les memes portes que Windows, dans le meme ordre, et AVANT le build. Un
      # portage qui se publierait sans passer les tests ne serait pas un portage.
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

      - name: Fetch the engine binaries (macOS arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-whisper.cjs
          node scripts/fetch-llama.cjs

      - name: Ensure the macOS key server is present (hard gate)
        run: |
          test -f node_modules/keyspy/runtime/MacKeyServer || {
            echo "MISSING MacKeyServer (no dictation shortcut)"; exit 1; }
          chmod +x node_modules/keyspy/runtime/MacKeyServer

      - run: npm run build

      - name: Build the macOS app (ad-hoc signed)
        run: npx electron-builder --mac --publish never

      - name: Refuse the second updater feed
        run: |
          # electron-builder ecrit latest-mac.yml des qu'un provider `publish`
          # global existe, et electron-builder.json en a un. Ce fichier EST un feed
          # electron-updater : le jour ou quelqu'un active autoUpdater sur darwin,
          # il serait ramasse tout seul et tenterait une installation Squirrel.Mac
          # qui echoue sur une signature ad-hoc. Le second chemin de publication
          # apparaitrait par le seul fait qu'un fichier porte le nom que la
          # bibliotheque cherche. On le supprime pour qu'aucun glob futur ne puisse
          # le ramasser.
          ls -la dist-build
          rm -f dist-build/latest-mac.yml dist-build/latest-mac-arm64.yml

      - name: Inspect the artifact BEFORE publishing
        run: |
          ZIP=$(ls dist-build/Flow-*-mac-arm64.zip)
          ls -l "$ZIP"
          # `ditto -x -k` et PAS `unzip` : un .app porte des liens symboliques (les
          # frameworks d'Electron) et des bits d'execution. `unzip -l` ne dit ni
          # l'un ni l'autre, et `unzip` les perd a l'extraction, donc un zip casse
          # passerait une inspection faite avec lui et l'app extraite chez
          # l'utilisateur ne se lancerait pas. On extrait comme l'application
          # s'extraira.
          WORK=$(mktemp -d)
          ditto -x -k "$ZIP" "$WORK"
          APP="$WORK/Flow.app"
          test -d "$APP" || { echo "le zip ne contient pas Flow.app"; ls -la "$WORK"; exit 1; }
          BIN="$APP/Contents/Resources/bin"
          test -f "$BIN/whisper-server-darwin-arm64" || { echo "MISSING whisper-server (no transcript)"; exit 1; }
          test -f "$BIN/llama-server" || { echo "MISSING llama-server (no meeting notes)"; exit 1; }
          # Un bit d'execution perdu echoue au spawn avec EACCES, une panne qui
          # ressemble a un fichier manquant.
          test -x "$BIN/whisper-server-darwin-arm64" || { echo "whisper-server sans bit d'execution"; exit 1; }
          test -x "$BIN/llama-server" || { echo "llama-server sans bit d'execution"; exit 1; }
          test -x "$APP/Contents/MacOS/Flow" || { echo "l'executable principal a perdu son bit d'execution"; exit 1; }
          # LE SCRIPT D'ECHANGE. Sans lui dans le paquet, toute la mise a jour
          # macOS est un no-op en production : la lecon de la 1.22.0, appliquee a
          # un fichier de ressource.
          test -f "$APP/Contents/Resources/mac-swap.sh" || { echo "MISSING mac-swap.sh (no self-update)"; exit 1; }
          # LE CROCHET CLAVIER, DANS LE PAQUET et pas dans node_modules. La porte de
          # mac-build.yml verifiait l'arbre de dependances : un paquet pouvait donc
          # sortir sans son serveur de touches, se lancer, et ne jamais repondre au
          # raccourci.
          KS=$(find "$APP/Contents/Resources" -name MacKeyServer -print -quit)
          test -n "$KS" || { echo "MISSING MacKeyServer dans le paquet (no dictation shortcut)"; exit 1; }
          # Les liens symboliques d'Electron. Un zip qui les a transformes en copies
          # donne une app qui ne demarre pas, et AUCUNE assertion de presence ne le
          # verrait. On compte, parce qu'un zip qui les perd en a zero.
          LINKS=$(find "$APP" -type l | wc -l | tr -d ' ')
          [ "$LINKS" -gt 0 ] || { echo "aucun lien symbolique : le zip a perdu la structure des frameworks"; exit 1; }
          echo "liens symboliques preserves : $LINKS"
          # Ecrit en `! ... ||` et PAS en `... && { exit 1; }` : cette seconde forme
          # rend 1 quand la recherche ne trouve rien, c'est-a-dire dans le cas SAIN,
          # et sous `set -e` elle ferait echouer la release chaque fois que tout va
          # bien. Meme piege que l'inspection Windows.
          ! find "$BIN" -name "*.exe" | grep -q . || { echo "le paquet macOS transporte des binaires Windows"; exit 1; }
          ! find "$APP" -name "ggml-rpc-server*" | grep -q . || { echo "l'elagage de llama n'a pas tourne"; exit 1; }
          # ---------------------------------------------------------------------
          # LA SIGNATURE : CE QU'ELLE EST VRAIMENT, MESURE LE 2026-08-05.
          #
          # Run 31000963544, temoin avant/apres. Le bundle QUE electron-builder VIENT
          # DE PRODUIRE, avant toute compression, n'a PAS de
          # Contents/_CodeSignature/CodeResources, et `codesign --verify` y echoue
          # deja : « code has no resources but signature indicates they must be
          # present ». Exactement comme apres l'aller-retour zip.
          #
          # CE QUE CA VEUT DIRE, et c'est different de ce que ce fichier affirmait :
          # `mac.identity: null` ne demande pas a electron-builder de signer ad-hoc,
          # il lui demande de NE PAS SIGNER. Ce qui reste est la signature que
          # l'editeur de liens d'Apple pose sur tout binaire arm64 - d'ou
          # `flags=0x20002(adhoc,linker-signed)` et `Identifier=Electron` (le binaire
          # Electron d'origine, et non ca.agrlabs.agrflow). Le bundle n'est donc pas
          # scelle : rien ne lie Contents/Resources a la signature.
          #
          # POURQUOI ON NE « CORRIGE » PAS EN SIGNANT VRAIMENT. Un `codesign --force
          # --deep --sign -` est gratuit et n'est pas un certificat, donc il ne
          # contredirait pas la decision de Roch. Mais il n'achete rien ici : TCC
          # continue de se lier au cdhash, qui change a chaque build ; Gatekeeper
          # continue de refuser faute de notarisation ; et l'integrite du paquet est
          # deja assuree, plus fortement, par le SHA-256 du manifeste et
          # l'attestation de provenance. Il ajouterait en revanche un risque reel :
          # `--deep` re-signerait les trois binaires tiers de Resources/bin.
          #
          # CE QU'ON VERIFIE DONC, ET QUI COMPTE VRAIMENT POUR LA MISE A JOUR :
          #  1. que l'aller-retour zip -> ditto rende un code IDENTIQUE au bit pres,
          #     ce que le CDHash prouve mieux que n'importe quel --verify ;
          #  2. que le noyau accepte de LANCER le binaire detendu, ce qu'aucune
          #     commande codesign ne dit et qui est pourtant la seule chose que
          #     l'utilisateur constate.
          # ---------------------------------------------------------------------
          ORIG="dist-build/mac-arm64/Flow.app"
          test -d "$ORIG" || ORIG="dist-build/mac/Flow.app"
          cdhash() { codesign -dvvv "$1" 2>&1 | sed -n 's/^CDHash=//p'; }
          CD_ORIG=$(cdhash "$ORIG")
          CD_ZIP=$(cdhash "$APP")
          echo "CDHash avant le zip : ${CD_ORIG:-<aucun>}"
          echo "CDHash apres ditto  : ${CD_ZIP:-<aucun>}"
          test -n "$CD_ZIP" || { echo "le bundle detendu n'a AUCUNE signature : macOS refusera de le lancer"; exit 1; }
          [ "$CD_ORIG" = "$CD_ZIP" ] || { echo "l'aller-retour zip a MODIFIE le code signe : la mise a jour livrerait autre chose que ce qui a ete inspecte"; exit 1; }
          codesign -dvvv "$APP" 2>&1 | grep -E "^(Identifier|Format|CodeDirectory|Signature)=" || true
          # Et le lancement reel. Un refus de signature tue le processus au demarrage
          # (SIGKILL) ; un Electron qui demarre vit et cree ses fenetres. C'est la
          # regle de ce depot appliquee au CI : ce qui peut etre verifie en lancant
          # l'application doit l'etre.
          echo "=== LE NOYAU LANCE-T-IL LE BINAIRE DETENDU ? ==="
          "$APP/Contents/MacOS/Flow" >/tmp/launch.out 2>&1 &
          LAUNCH_PID=$!
          sleep 8
          if kill -0 "$LAUNCH_PID" 2>/dev/null; then
            echo "  le processus VIT apres 8 s : le noyau a accepte la signature"
            kill "$LAUNCH_PID" 2>/dev/null || true
          else
            echo "  le paquet n'a pas tenu 8 secondes. Sortie :"
            head -30 /tmp/launch.out || true
            exit 1
          fi
          rm -rf "$WORK"

      - name: Write the manifest the macOS app reads
        run: |
          ZIP=$(ls dist-build/Flow-*-mac-arm64.zip)
          node scripts/mac-manifest.cjs --zip "$ZIP" --tag "$GITHUB_REF_NAME" --out dist-build/mac-arm64.json
          node scripts/mac-manifest.cjs --verify dist-build/mac-arm64.json --zip "$ZIP"
          # Un outil SYSTEME, independant de notre code, confirme le nombre. C'est
          # aussi exactement la commande que Roch tapera sur son Mac pour verifier a
          # la main.
          WANT=$(node -e 'console.log(require("./dist-build/mac-arm64.json").sha256)')
          GOT=$(shasum -a 256 "$ZIP" | cut -d" " -f1)
          [ "$WANT" = "$GOT" ] || { echo "notre empreinte ($WANT) et shasum ($GOT) ne s accordent pas"; exit 1; }
          cat dist-build/mac-arm64.json

      # Attester ICI, avant l'upload, pour la meme raison qu'a l'etape 17 : ce qui
      # est signe est ce qui vient d'etre inspecte.
      #
      # L'arbitrage ecarte 0/3 portait sur latest.yml, et ses deux motifs ne
      # transposent pas : il s'agissait d'un MANIFESTE et non d'un executable, et il
      # disait que la verification de signature d'electron-updater est un no-op
      # faute de publisherName. Sur mac il n'y a meme pas de no-op a reparer : la
      # signature est ad-hoc, donc AUCUNE autorite ne dit d'ou viennent ces octets.
      # L'attestation est la seule affirmation existante sur l'origine du paquet
      # mac, et ne pas la produire serait retirer le seul instrument disponible la
      # ou il n'y a rien d'autre.
      - name: Attest what was built (macOS)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist-build/Flow-*-mac-arm64.zip

      - name: Publish the macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # TROIS appels, et l'ordre EST le contrat. `gh` televerse les fichiers
          # d'un meme appel en parallele, donc un appel unique pourrait publier
          # mac-arm64.json avant la fin du zip : une fenetre pendant laquelle un Mac
          # lit un manifeste qui pointe vers un asset absent. Le manifeste EST la
          # publication ; le zip n'est que des octets tant que rien ne le nomme.
          #
          # Jamais `gh release create` ici : `needs: release` garantit que la
          # release existe, et le job Windows en est le seul createur. Il possede
          # aussi latest.yml, que ce job ne touche sous aucun pretexte.
          #
          # Pas de .blockmap : il ne sert qu'au telechargement differentiel
          # d'electron-updater, hors jeu sur mac. D'ou le glob sans etoile finale.
          gh release upload "$GITHUB_REF_NAME" --clobber dist-build/Flow-*-mac-arm64.zip
          gh release upload "$GITHUB_REF_NAME" --clobber dist-build/Flow-*-mac-arm64.dmg
          gh release upload "$GITHUB_REF_NAME" --clobber dist-build/mac-arm64.json

      - name: Verify the mac update document is live
        run: |
          # « La release existe » n'est pas la meme chose que « l'APPLICATION la
          # voit ». Ceci assert ce qu'un Mac va reellement chercher, sur l'URL
          # anonyme « latest » que src/main/update/macManifest.ts epelle.
          URL="https://github.com/${{ github.repository }}/releases/latest/download/mac-arm64.json"
          OK=""
          for i in 1 2 3 4 5; do
            CODE=$(curl -sL -o live.json -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then OK=1; echo "mac-arm64.json est joignable"; break; fi
            echo "essai $i : pas encore joignable ($CODE)"; sleep 30
          done
          [ -n "$OK" ] || { echo "mac-arm64.json n est jamais devenu joignable : aucun Mac ne verra cette version"; exit 1; }
          cat live.json
          # `releases/latest` designe la release la plus RECENTE, pas forcement le
          # tag qu'on vient de pousser.
          LIVE=$(node -e 'console.log(require("./live.json").version)')
          PKG=$(node -p "require('./package.json').version")
          [ "$LIVE" = "$PKG" ] || { echo "le document que l app lira nomme $LIVE, pas $PKG"; exit 1; }
          # Et l'asset qu'il nomme se telecharge vraiment, par le chemin exact que
          # l'application compose.
          NAME=$(node -e 'console.log(require("./live.json").zip)')
          CODE=$(curl -sIL -o /dev/null -w "%{http_code}" \
            "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$NAME")
          [ "$CODE" = "200" ] || { echo "l asset nomme par le manifeste ne se telecharge pas ($CODE)"; exit 1; }
          echo "le document, la version et l asset s accordent : un Mac peut se mettre a jour"
