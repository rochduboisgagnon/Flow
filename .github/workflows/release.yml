name: Release

# A tag is the ONLY road to users. Nothing publishes from a branch push, so an
# ordinary commit can never become a release - `git tag v1.1.0 && git push
# --tags` is the deliberate gesture that ships. electron-builder uploads the
# NSIS installer, the portable zip and latest.yml (the manifest electron-updater
# reads) to the matching GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # electron-builder creates the release and uploads the assets
  # 2026-07-31, security pass. Build provenance: GitHub signs a statement saying
  # WHICH workflow, at WHICH commit, produced these exact bytes. Both are needed
  # for it - a short-lived OIDC identity to sign with, and the right to store the
  # attestation - and neither grants anything else.
  #
  # What it buys, precisely, because overclaiming here would be worse than not
  # doing it: an installer swapped onto the release page by hand, outside this
  # workflow, no longer verifies. Anyone can check with
  # `gh attestation verify Flow-Setup-x.y.z.exe --repo rochduboisgagnon/Flow`.
  #
  # What it does NOT buy: someone who can push a tag still gets a genuine,
  # attested build of whatever they pushed. Provenance proves the OVEN, never
  # the recipe. Only branch protection and code signing address that, and the
  # second one cannot be bought with code.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Review A10: the tag decides NOTHING by itself - electron-builder ships
      # whatever package.json says. A tag that disagrees with the source would
      # publish a mislabeled version, and a re-tag of an already-published
      # version would corrupt the update feed. Refuse both, before any work.
      - name: Guard tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($PKG)"; exit 1
          fi
      - name: Guard version not already released
        # 2026-08-02: the token travels by env, like every other step here. It
        # used to be expanded into the script BODY, which GitHub writes to disk
        # on the runner before executing - so the credential sat in a temp file
        # and on a command line rather than only in the process environment.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$GITHUB_REF_NAME")
          if [ "$CODE" = "200" ]; then
            echo "A release for $GITHUB_REF_NAME already exists"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # keyspy's own postinstall downloads WinKeyServer from GitHub releases;
      # anonymous API calls from shared runner IPs get rate-limited, which is
      # exactly how a release without push-to-talk could slip out. Retry the
      # install, then HARD-verify the binary below - and again inside the zip.
      - name: Install dependencies (with keyspy retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci || (sleep 30 && npm ci) || (sleep 60 && npm ci)

      # The same gates as CI, BEFORE anything is published: a build that breaks
      # must fail here, not on a user's machine halfway through an auto-update.
      # (The real-engine tests skip themselves without a speech model on CI.)
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

      # Two binaries the repository does not carry, and without which the
      # installer would look fine and do nothing:
      #  - WinKeyServer.exe (keyspy) = the push-to-talk hook. ensure-keyspy
      #    downgrades its failure to a warning when CI is set; a RELEASE ships,
      #    so CI is cleared and a missing hook binary fails the job loudly.
      #  - resources/bin/whisper-server-*.exe = the speech engine itself
      #    (gitignored, ~120 MB, fetched from the whisper.cpp fork releases).
      #
      # keyspy's own postinstall downloads its archive ANONYMOUSLY from
      # github.com/teomyth/keyspy - and the runners' shared IPs get
      # rate-limited, which is exactly how the v1.0.1 run died at the gate.
      # Re-fetch AUTHENTICATED (gh quota) when the postinstall came up empty,
      # extracting with the System32 tar by absolute path (Git's MSYS tar
      # reads C:\ as a remote host - documented trap in ensure-keyspy.cjs).
      - name: Fetch keyspy runtime (authenticated fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RT=node_modules/keyspy/runtime
          if [ ! -f "$RT/WinKeyServer.exe" ]; then
            KV=$(node -p "require('./node_modules/keyspy/package.json').version")
            mkdir -p "$RT"
            gh release download "v$KV" --repo teomyth/keyspy --pattern "keyspy-win32-x64.tar.gz" --dir "$RT" --clobber
            # 2026-08-02, security scan (HIGH): verified BEFORE extraction. This
            # archive contains WinKeyServer.exe - the process that watches every
            # keystroke on the machine - and it used to be unpacked on the word
            # of a third-party release page. Pinning the version is not enough:
            # GitHub lets an asset be REPLACED in place, so a tag names a file,
            # never its bytes. Only the hash names the bytes.
            node scripts/verify-native-deps.cjs keyspy "$RT/keyspy-win32-x64.tar.gz"
            "/c/Windows/System32/tar.exe" -xzf "$RT/keyspy-win32-x64.tar.gz" -C "$RT"
          fi
          ls "$RT"
      - name: Ensure push-to-talk binary (hard gate)
        env:
          CI: ""
        run: node scripts/ensure-keyspy.cjs
      # The speech engine binaries live in a GitHub release too, so this call
      # needs the same authenticated budget as the keyspy fetch above: the
      # v1.3.0 run died right here on the 60-per-hour anonymous limit that
      # hosted runners share across every project on the same IP.
      - name: Fetch the speech engine binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-whisper.cjs

      # D1, 2026-08-03. Le moteur qui REDIGE les notes, et la piece qui manquait
      # pour de bon : sans cette etape, l'installeur ne porte pas
      # llama-server.exe, `llamaServer.ready()` est faux pour toujours chez
      # l'utilisateur, et le cablage ajoute dans index.ts ne s'execute jamais.
      #
      # C'est litteralement la panne de la 1.22.0 sous une autre forme. Cette
      # release-la a annonce que l'invariant « un ami qui installe Flow a le
      # produit complet » etait ferme, alors que la classe existait sans que rien
      # ne l'instancie. Livrer le cablage sans cette ligne aurait refait la meme
      # promesse, une couche plus bas. Le controle du zip, plus bas, est ce qui
      # empeche de la refaire une troisieme fois.
      - name: Fetch the notes engine binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-llama.cjs

      - run: npm run build
      # Build WITHOUT publishing: the artifact gets inspected first. Publishing
      # a broken installer and then noticing is the wrong order of operations.
      - name: Build installers
        run: npx electron-builder --win --publish never

      # The zip is the ground truth of what is about to ship. An installer with
      # no hook binary or no speech engine passes every gate above EXCEPT this.
      - name: Inspect the artifact BEFORE publishing
        run: |
          ZIP=$(ls dist-build/Flow-*-win.zip)
          unzip -l "$ZIP" > ziplist.txt
          grep -q "WinKeyServer.exe" ziplist.txt || { echo "MISSING WinKeyServer.exe (no push-to-talk)"; exit 1; }
          grep -q "whisper-server-win32-x64-vulkan.exe" ziplist.txt || { echo "MISSING vulkan whisper-server"; exit 1; }
          grep -q "whisper-server-win32-x64-cpu.exe" ziplist.txt || { echo "MISSING cpu whisper-server"; exit 1; }
          # D1: le moteur de redaction. Absent, l'application se lance, dicte,
          # enregistre, et ne rend jamais de notes - une panne silencieuse qui
          # ressemble a une fonctionnalite manquante plutot qu'a un installeur
          # incomplet. Elle a deja ete livree une fois, en 1.22.0.
          grep -q "llama-server.exe" ziplist.txt || { echo "MISSING llama-server.exe (no meeting notes)"; exit 1; }
          grep -q "ggml-vulkan.dll" ziplist.txt || { echo "MISSING ggml backend for llama-server"; exit 1; }
          # Et l'inverse : les vingt-deux outils que fetch-llama.cjs elague. S'ils
          # reapparaissent, c'est que l'elagage a saute, et ggml-rpc-server.exe -
          # un backend de calcul reseau - serait signe et installe avec Flow.
          # Ecrit en `! grep ... ||` et PAS en `grep ... && { exit 1; }` : cette
          # seconde forme rend 1 quand grep ne trouve rien, c'est-a-dire dans le
          # cas SAIN, et sous `set -e` elle ferait echouer la release a chaque
          # fois que tout va bien.
          ! grep -q "ggml-rpc-server.exe" ziplist.txt || { echo "llama pruning did not run: ggml-rpc-server.exe is in the artifact"; exit 1; }
          test -f dist-build/latest.yml || { echo "MISSING latest.yml (updater feed manifest)"; exit 1; }
          echo "artifact carries the hook, both speech backends, the notes engine, and the feed manifest"

      # Attested BEFORE publishing, deliberately: the bytes that get signed are
      # the ones just inspected above, and nothing between here and the upload
      # can substitute them without the attestation failing.
      - name: Attest what was built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist-build/Flow*Setup*.exe
            dist-build/Flow-*-win.zip

      # gh release create publishes a NON-DRAFT release in one step (a draft
      # would be invisible to electron-updater - review A10). Exactly the four
      # asset kinds electron-builder would have uploaded itself.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Flow $GITHUB_REF_NAME" \
            --generate-notes \
            dist-build/Flow*Setup*.exe \
            dist-build/*.blockmap \
            dist-build/Flow-*-win.zip \
            dist-build/latest.yml

      # Review A10: the release existing is not the same as the UPDATER seeing
      # it. This asserts what a user's machine will actually fetch: the feed
      # manifest, over the same anonymous "latest" URL electron-updater uses.
      - name: Verify the update feed is live
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
              "https://github.com/${{ github.repository }}/releases/latest/download/latest.yml")
            if [ "$CODE" = "200" ]; then echo "latest.yml is live"; exit 0; fi
            echo "attempt $i: latest.yml not reachable yet ($CODE)"; sleep 30
          done
          echo "latest.yml never became reachable: the release is not visible to the updater"
          exit 1
