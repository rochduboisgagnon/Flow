name: macOS build (test)

# ---------------------------------------------------------------------------
# 2026-08-05 : LE BANC D'ESSAI macOS. Il ne publie rien, et ce n'est plus tout a
# fait la meme phrase qu'avant.
#
# Ce fichier disait le 2026-08-04 : « pas d'auto-update sur Mac ». C'etait vrai de
# Squirrel.Mac, qui exige un Developer ID, et faux de la question que Roch posait :
# « que l'app sur macOS se mette a jour sans reinstaller l'ancienne version ». Il y
# a donc desormais une mise a jour macOS, et elle est publiee par release.yml, job
# `mac`, sur le MEME tag que Windows.
#
# LA REGLE N'A PAS CHANGE D'UN MOT : jamais deux chemins de publication. Il y en a
# UN, et c'est le tag. `git tag vX && git push --tags` declenche release.yml, dont
# le job `release` cree la release et possede latest.yml (le feed que les
# installations Windows interrogent), et dont le job `mac` AJOUTE trois assets a
# cette release : le zip arm64, le dmg, et mac-arm64.json, le document que
# l'application macOS lit. Le job mac n'appelle jamais `gh release create` et ne
# televerse aucun .yml.
#
# CE FICHIER-CI, LUI, NE PUBLIE TOUJOURS RIEN, et c'est sa raison d'exister : il
# depose un artefact telechargeable pour essayer un paquet Mac AVANT de tagger. Un
# test (test/mac-release.test.ts) verifie qu'il ne contient ni `gh release create`,
# ni `gh release upload`, ni un `--publish` autre que `never` : la regle est
# machine-verifiable, et pas seulement ecrite ici.
#
# MANUEL (`workflow_dispatch`) plutot qu'a chaque commit : un runner macOS coute
# dix fois un runner Linux en minutes, le depot est public donc c'est gratuit, mais
# construire un paquet Mac a chaque commit serait du bruit.
#
# ---------------------------------------------------------------------------
# LA SIGNATURE EST AD-HOC, ET CE QUE CA COUTE EST DIT
# ---------------------------------------------------------------------------
#
# Decision de Roch, invariante : aucun certificat ne sera achete, et un auto-signe
# n'apporte rien.
#
# 2026-08-05, CORRECTION D'UNE AFFIRMATION FAUSSE DE CE FICHIER. Il disait
# qu'electron-builder signe ad-hoc de lui-meme quand `mac.identity` vaut null.
# Mesure (run 31000963544) : NON. `identity: null` veut dire NE PAS SIGNER. Le
# paquet ne porte que la signature que l'editeur de liens d'Apple pose sur tout
# binaire arm64 - `flags=0x20002(adhoc,linker-signed)`, `Identifier=Electron`, et
# aucun `_CodeSignature/CodeResources`. Le noyau la trouve suffisante pour lancer
# l'application (verifie en la lancant vraiment), et c'est tout ce dont ce paquet
# a besoin. Rien de ce qui suit ne change ; seule la phrase qui l'expliquait etait
# fausse.
#
# Trois consequences, ecrites ici pour qu'elles ne soient pas decouvertes :
#
#  1. Gatekeeper rale au premier lancement telecharge par un navigateur (« Apple
#     ne peut pas verifier »). Le remede est `xattr -dr com.apple.quarantine
#     /Applications/Flow.app`, pas un clic droit. A MESURER apres une mise a jour
#     automatique : com.apple.quarantine est pose par le TELECHARGEUR, et Flow
#     telecharge sa propre mise a jour avec node:https, donc l'attribut ne devrait
#     pas y etre du tout (`xattr -p com.apple.quarantine /Applications/Flow.app`).
#  2. LES PERMISSIONS NE COLLENT PAS. macOS attache l'autorisation Accessibilite a
#     la signature ; en ad-hoc elle change a chaque build, donc elle doit etre
#     redonnee a chaque version, mise a jour comprise. C'est la surprise la plus
#     probable, et l'application la PREVIENT desormais au lieu de la laisser
#     decouvrir (voir src/shared/accessibility.ts).
#  3. electron-updater reste hors jeu sur mac : Squirrel.Mac exige un Developer ID.
#     C'est pour cela que le document publie s'appelle mac-arm64.json et NON
#     latest-mac.yml - ce nom-la serait ramasse tout seul par la bibliotheque.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Ce que ce build est cense verifier (apparait dans le resume)"
        required: false
        default: "portage macOS"

jobs:
  build:
    # macos-14 est arm64, ce qui est l'architecture des assets epingles pour mac.
    # Un runner Intel produirait un paquet x64 pour lequel aucun moteur n'est
    # epingle, et la recuperation echouerait bruyamment - ce qui est le bon
    # comportement, mais autant demander la bonne machine.
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Les memes portes que la CI de Windows, dans le meme ordre. Un portage qui
      # se construirait sans passer les tests ne serait pas un portage.
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck

      # Les moteurs, choisis par plateforme depuis le manifeste d'empreintes.
      # `GH_TOKEN` pour la meme raison que sur Windows : les runners partagent
      # leurs adresses et le quota anonyme de l'API GitHub est de 60 appels a
      # l'heure pour tout le monde.
      - name: Fetch the engine binaries (macOS arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-whisper.cjs
          node scripts/fetch-llama.cjs
          ls -la resources/bin

      # Le serveur de touches de macOS est deja dans le paquet npm de keyspy
      # (runtime/MacKeyServer, a cote de WinKeyServer.exe), donc rien a telecharger.
      # Verifie quand meme : sans lui, l'app se lance et le raccourci ne repond
      # jamais - exactement la panne silencieuse que ce depot chasse.
      - name: Ensure the macOS key server is present (hard gate)
        run: |
          test -f node_modules/keyspy/runtime/MacKeyServer || {
            echo "MISSING MacKeyServer (no dictation shortcut)"; exit 1; }
          chmod +x node_modules/keyspy/runtime/MacKeyServer
          ls -la node_modules/keyspy/runtime

      - run: npm run build

      - name: Build the macOS app (ad-hoc signed)
        run: npx electron-builder --mac --publish never

      - name: Refuse the second updater feed
        run: |
          # Meme geste que le job qui publie : latest-mac.yml EST un feed
          # electron-updater, et le laisser trainer dans dist-build c'est laisser un
          # futur glob le ramasser. A MESURER a la premiere execution : `--publish
          # never` l'ecrit-il quand meme ? Le `ls -la` repond. Le `rm -f` reste de
          # toute facon, il coute zero.
          ls -la dist-build
          rm -f dist-build/latest-mac.yml dist-build/latest-mac-arm64.yml

      # LES MEMES PORTES QUE LE JOB QUI PUBLIE, deliberement : c'est ici qu'elles
      # sont mises au point, pour qu'une porte ne soit jamais essayee pour la
      # premiere fois sur une release.
      - name: Inspect the artifact the way the app will read it
        run: |
          ZIP=$(ls dist-build/Flow-*-mac-arm64.zip)
          ls -l "$ZIP"
          # LA MESURE QUI MANQUE AU CODE : MIN_ZIP_BYTES dans
          # src/main/update/macManifest.ts porte encore un chiffre provisoire (60
          # Mio), avec pour consigne de le resserrer a environ la moitie de la
          # taille reelle. La voici.
          echo "TAILLE REELLE DU ZIP MAC : $(stat -f%z "$ZIP") octets"
          shasum -a 256 "$ZIP"
          # Un zip telecharge par l'application n'a pas de quarantaine (elle est
          # posee par le TELECHARGEUR). Celui-ci vient d'etre fabrique ici, donc il
          # ne devrait rien avoir non plus : la mesure est gratuite et repond a la
          # question du bandeau.
          xattr -l "$ZIP" || true
          # `ditto -x -k` et PAS `unzip` : un .app porte des liens symboliques et
          # des bits d'execution, et unzip les perd. On extrait comme l'application
          # s'extraira, sinon on inspecte une arborescence deja abimee.
          WORK=$(mktemp -d)
          ditto -x -k "$ZIP" "$WORK"
          APP="$WORK/Flow.app"
          test -d "$APP" || { echo "le zip ne contient pas Flow.app"; ls -la "$WORK"; exit 1; }
          BIN="$APP/Contents/Resources/bin"
          test -f "$BIN/whisper-server-darwin-arm64" || { echo "MISSING whisper-server (no transcript)"; exit 1; }
          test -f "$BIN/llama-server" || { echo "MISSING llama-server (no meeting notes)"; exit 1; }
          test -x "$BIN/whisper-server-darwin-arm64" || { echo "whisper-server sans bit d'execution"; exit 1; }
          test -x "$BIN/llama-server" || { echo "llama-server sans bit d'execution"; exit 1; }
          test -x "$APP/Contents/MacOS/Flow" || { echo "l'executable principal a perdu son bit d'execution"; exit 1; }
          test -f "$APP/Contents/Resources/mac-swap.sh" || { echo "MISSING mac-swap.sh (no self-update)"; exit 1; }
          # LE CROCHET CLAVIER, DANS LE PAQUET. L'ancienne porte verifiait
          # node_modules, c'est-a-dire l'arbre de dependances et pas le paquet : un
          # paquet mac pouvait donc sortir sans son serveur de touches, se lancer, et
          # ne jamais repondre au raccourci. C'est la panne de la 1.22.0 sous une
          # quatrieme forme.
          KS=$(find "$APP/Contents/Resources" -name MacKeyServer -print -quit)
          test -n "$KS" || { echo "MISSING MacKeyServer dans le paquet (no dictation shortcut)"; exit 1; }
          # Les liens symboliques d'Electron : un zip qui les transforme en copies
          # donne une app qui ne demarre pas, et aucune assertion de presence ne le
          # verrait. On compte, parce qu'un zip qui les perd en a zero.
          LINKS=$(find "$APP" -type l | wc -l | tr -d ' ')
          [ "$LINKS" -gt 0 ] || { echo "aucun lien symbolique : le zip a perdu la structure des frameworks"; exit 1; }
          echo "liens symboliques preserves : $LINKS"
          ! find "$BIN" -name "*.exe" | grep -q . || { echo "le paquet macOS transporte des binaires Windows"; exit 1; }
          ! find "$APP" -name "ggml-rpc-server*" | grep -q . || { echo "l'elagage de llama n'a pas tourne"; exit 1; }
          # ---------------------------------------------------------------------
          # LA SIGNATURE : CE QU'ELLE EST VRAIMENT, MESURE LE 2026-08-05.
          #
          # Run 31000963544, temoin avant/apres. Le bundle QUE electron-builder VIENT
          # DE PRODUIRE, avant toute compression, n'a PAS de
          # Contents/_CodeSignature/CodeResources, et `codesign --verify` y echoue
          # deja : « code has no resources but signature indicates they must be
          # present ». Exactement comme apres l'aller-retour zip.
          #
          # CE QUE CA VEUT DIRE, et c'est different de ce que ce fichier affirmait :
          # `mac.identity: null` ne demande pas a electron-builder de signer ad-hoc,
          # il lui demande de NE PAS SIGNER. Ce qui reste est la signature que
          # l'editeur de liens d'Apple pose sur tout binaire arm64 - d'ou
          # `flags=0x20002(adhoc,linker-signed)` et `Identifier=Electron` (le binaire
          # Electron d'origine, et non ca.agrlabs.agrflow). Le bundle n'est donc pas
          # scelle : rien ne lie Contents/Resources a la signature.
          #
          # POURQUOI ON NE « CORRIGE » PAS EN SIGNANT VRAIMENT. Un `codesign --force
          # --deep --sign -` est gratuit et n'est pas un certificat, donc il ne
          # contredirait pas la decision de Roch. Mais il n'achete rien ici : TCC
          # continue de se lier au cdhash, qui change a chaque build ; Gatekeeper
          # continue de refuser faute de notarisation ; et l'integrite du paquet est
          # deja assuree, plus fortement, par le SHA-256 du manifeste et
          # l'attestation de provenance. Il ajouterait en revanche un risque reel :
          # `--deep` re-signerait les trois binaires tiers de Resources/bin.
          #
          # CE QU'ON VERIFIE DONC, ET QUI COMPTE VRAIMENT POUR LA MISE A JOUR :
          #  1. que l'aller-retour zip -> ditto rende un code IDENTIQUE au bit pres,
          #     ce que le CDHash prouve mieux que n'importe quel --verify ;
          #  2. que le noyau accepte de LANCER le binaire detendu, ce qu'aucune
          #     commande codesign ne dit et qui est pourtant la seule chose que
          #     l'utilisateur constate.
          # ---------------------------------------------------------------------
          ORIG="dist-build/mac-arm64/Flow.app"
          test -d "$ORIG" || ORIG="dist-build/mac/Flow.app"
          cdhash() { codesign -dvvv "$1" 2>&1 | sed -n 's/^CDHash=//p'; }
          CD_ORIG=$(cdhash "$ORIG")
          CD_ZIP=$(cdhash "$APP")
          echo "CDHash avant le zip : ${CD_ORIG:-<aucun>}"
          echo "CDHash apres ditto  : ${CD_ZIP:-<aucun>}"
          test -n "$CD_ZIP" || { echo "le bundle detendu n'a AUCUNE signature : macOS refusera de le lancer"; exit 1; }
          [ "$CD_ORIG" = "$CD_ZIP" ] || { echo "l'aller-retour zip a MODIFIE le code signe : la mise a jour livrerait autre chose que ce qui a ete inspecte"; exit 1; }
          codesign -dvvv "$APP" 2>&1 | grep -E "^(Identifier|Format|CodeDirectory|Signature)=" || true
          # Et le lancement reel. Un refus de signature tue le processus au demarrage
          # (SIGKILL) ; un Electron qui demarre vit et cree ses fenetres. C'est la
          # regle de ce depot appliquee au CI : ce qui peut etre verifie en lancant
          # l'application doit l'etre.
          echo "=== LE NOYAU LANCE-T-IL LE BINAIRE DETENDU ? ==="
          "$APP/Contents/MacOS/Flow" >/tmp/launch.out 2>&1 &
          LAUNCH_PID=$!
          sleep 8
          if kill -0 "$LAUNCH_PID" 2>/dev/null; then
            echo "  le processus VIT apres 8 s : le noyau a accepte la signature"
            kill "$LAUNCH_PID" 2>/dev/null || true
          else
            echo "  le paquet n'a pas tenu 8 secondes. Sortie :"
            head -30 /tmp/launch.out || true
            exit 1
          fi
          rm -rf "$WORK"

      - name: Write the manifest, exactly as the release does
        run: |
          ZIP=$(ls dist-build/Flow-*-mac-arm64.zip)
          # Le tag n'existe pas sur un banc d'essai : on prend celui que
          # package.json implique, pour que le script suive le MEME chemin qu'en
          # release plutot qu'un chemin de test qui divergerait.
          TAG="v$(node -p "require('./package.json').version")"
          node scripts/mac-manifest.cjs --zip "$ZIP" --tag "$TAG" --out dist-build/mac-arm64.json
          node scripts/mac-manifest.cjs --verify dist-build/mac-arm64.json --zip "$ZIP"
          cat dist-build/mac-arm64.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Flow-macOS-arm64
          path: |
            dist-build/*.dmg
            dist-build/*-mac-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: What to do with it
        run: |
          {
            echo "### Flow pour macOS (arm64) : ${{ inputs.note }}"
            echo ""
            echo "1. Telecharger l'artefact **Flow-macOS-arm64**, ouvrir le .dmg, glisser Flow dans Applications."
            echo "2. **Premier lancement** : clic droit sur Flow, puis *Ouvrir*. Gatekeeper rale une fois"
            echo "   parce que le build est signe ad-hoc (pas de compte Apple Developer, choix assume)."
            echo "3. macOS demandera la permission **Accessibilite** au nom de « Flow » : c'est le raccourci"
            echo "   de dictee. Elle devra etre redonnee a chaque nouveau build, la signature ad-hoc changeant"
            echo "   a chaque fois."
            echo "4. Le raccourci par defaut sur Mac est **Fn + Shift**."
            echo ""
            echo "Ce qui NE fonctionne pas encore sur Mac, et l'application le dit elle-meme :"
            echo "la capture du son du PC pendant une reunion (ScreenCaptureKit, en cours) et le silence"
            echo "des autres applications pendant une dictee (macOS n'a pas d'API de volume par application)."
          } >> "$GITHUB_STEP_SUMMARY"
