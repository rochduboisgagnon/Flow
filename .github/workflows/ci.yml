name: CI

on:
  push:
    branches: [main]
  pull_request:

# 2026-08-02, security scan (LOW): declared rather than inherited. This job runs
# `npm ci` on a pull request, i.e. the PR's OWN postinstall and tests. A token
# that grows because a repository setting changed later is not a risk anyone
# would notice; naming least privilege here means it cannot.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
